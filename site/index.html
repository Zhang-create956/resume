<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>个人档案馆 · 张卓</title>
  <style>
    :root {
      --blue: #168de9;
      --blue-deep: #0876ca;
      --ink: #0e1119;
      --paper: #f8f7f5;
      --line: rgba(22, 141, 233, .72);
      --radius: 18px;
      --ease: cubic-bezier(.22, .8, .22, 1);
      --transition: 780ms;
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .app { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; background: var(--ink); }
    .intro, .experience { position: absolute; inset: 0; }

    .intro { z-index: 20; display: grid; place-items: center; background: #000; transition: opacity 700ms var(--ease), transform 700ms var(--ease), visibility 0s linear 700ms; }
    .intro.is-leaving { opacity: 0; transform: scale(1.018); pointer-events: none; visibility: hidden; }
    .intro video { width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); max-width: 100vw; max-height: 100vh; object-fit: cover; object-position: center; display: block; }
    .skip, .start-hint { position: absolute; z-index: 2; border: 1px solid rgba(255,255,255,.45); color: #fff; background: rgba(8, 11, 18, .44); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px; letter-spacing: .08em; transition: background 220ms ease, transform 220ms ease, opacity 220ms ease; }
    .skip { top: 22px; right: 22px; padding: 10px 16px; cursor: pointer; font-size: 13px; }
    .skip:hover { background: rgba(255,255,255,.22); transform: translateY(-1px); }
    .start-hint { left: 50%; bottom: calc(var(--safe-bottom) + 18px); transform: translateX(-50%); padding: 11px 18px; font-size: 14px; pointer-events: none; opacity: 0; white-space: nowrap; }
    .start-hint.is-visible { opacity: 1; pointer-events: auto; cursor: pointer; }

    .experience { display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity 760ms var(--ease); background: var(--ink); }
    .app.resume-visible .experience { opacity: 1; pointer-events: auto; }
    .stage { position: relative; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); max-width: 100vw; max-height: 100vh; overflow: hidden; background: var(--paper); isolation: isolate; }
    .visual { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; opacity: 0; transition: opacity 980ms var(--ease); will-change: opacity; }
    /* The default portrait remains beneath every pose, so a switch never exposes an empty frame. */
    .visual.base { z-index: 0; opacity: 1; transform: none; filter: none; transition: none; }
    .visual.fx { z-index: 1; }
    .visual.fx.is-visible { opacity: 1; }
    .visual.fx.is-entering { opacity: 0; }


    .card-layer { position: absolute; inset: 0; z-index: 4; }
    .card-ui { position: absolute; display: block; border: 0; padding: 0; margin: 0; cursor: pointer; background: transparent; border-radius: 5%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .card-ui::before { content: ""; position: absolute; inset: -2%; border-radius: 5%; border: 2px solid transparent; box-shadow: 0 0 0 0 rgba(22,141,233,0); transition: border-color 250ms ease, box-shadow 250ms ease, background 250ms ease; }
    .card-ui::after { content: attr(data-label); position: absolute; left: 50%; top: calc(100% + 7px); transform: translate(-50%, -4px); color: #fff; background: rgba(10, 14, 23, .82); padding: 5px 9px; border-radius: 999px; font-weight: 750; font-size: clamp(8px, .75vw, 12px); letter-spacing: .04em; white-space: nowrap; opacity: 0; transition: opacity 220ms ease, transform 220ms ease; box-shadow: 0 7px 14px rgba(0,0,0,.17); pointer-events: none; }
    .card-ui:hover::before, .card-ui:focus-visible::before, .card-ui.is-selected::before { border-color: rgba(22,141,233,.9); background: rgba(22,141,233,.06); box-shadow: 0 0 0 6px rgba(22,141,233,.15); }
    .card-ui:hover::after, .card-ui:focus-visible::after, .card-ui.is-selected::after { opacity: 1; transform: translate(-50%, 0); }
    .card-1 { left: 9.5%; top: 14.1%; width: 19.5%; height: 26%; transform: rotate(-17deg); }
    .card-2 { left: 29.3%; top: 8%; width: 20%; height: 23%; transform: rotate(-3deg); }
    .card-3 { left: 53.6%; top: 8.1%; width: 18.8%; height: 22%; transform: rotate(3deg); }
    .card-4 { left: 70.9%; top: 14%; width: 18.7%; height: 25%; transform: rotate(15deg); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 22px; background: rgba(3, 7, 14, .68); opacity: 0; pointer-events: none; transition: opacity 270ms ease; }
    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }
    .modal { width: min(1440px, 80vw); max-height: min(720px, calc(100dvh - 44px)); overflow: auto; position: relative; background: rgba(253,253,252,.98); border: 1px solid rgba(255,255,255,.75); border-radius: var(--radius); box-shadow: 0 28px 90px rgba(0,0,0,.45); transform: translateY(18px) scale(.965); opacity: 0; transition: transform 310ms var(--ease), opacity 310ms var(--ease); }
    .modal-backdrop.is-open .modal { transform: translateY(0) scale(1); opacity: 1; }
    .modal-header { display: flex; align-items: start; justify-content: space-between; padding: 25px 27px 15px; border-bottom: 1px solid #e5e8ed; }
    .modal-kicker { margin: 0 0 6px; color: var(--blue-deep); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .modal h2 { margin: 0; font-size: clamp(23px, 4vw, 32px); letter-spacing: -.04em; }
    .modal-close { width: 36px; height: 36px; border: 1px solid #d9e1ea; border-radius: 50%; color: var(--ink); background: #fff; cursor: pointer; font-size: 23px; line-height: 1; transition: transform 180ms ease, border-color 180ms ease; }
    .modal-close:hover { transform: rotate(90deg); border-color: var(--blue); }
    .modal-content { padding: 22px 27px 29px; line-height: 1.75; color: #394251; }
    .modal-content p { margin: 0 0 14px; }
    .modal-content .rule { width: 48px; height: 4px; margin: 0 0 16px; border-radius: 99px; background: var(--blue); }
    .detail-list { display: grid; gap: 10px; margin: 17px 0 0; padding: 0; list-style: none; }
    .detail-list li { display: flex; gap: 10px; align-items: baseline; padding: 11px 13px; background: #f4f8fc; border-left: 3px solid var(--blue); border-radius: 0 9px 9px 0; }
    .detail-list b { color: var(--ink); min-width: 72px; }
    .experience-intro { margin-bottom: 22px !important; color: #4a5667; }
    .education-section { margin: 0 0 25px; padding: 16px; border-left: 3px solid var(--blue); background: linear-gradient(135deg, #f8fcff, #eff7fd); }
    .resume-section-heading { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; color: var(--ink); font-size: 15px; }
    .resume-section-heading::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px rgba(22,141,233,.12); }
    .education-list { display: grid; gap: 16px; }
    .education-entry { position: relative; min-height: 106px; padding: 14px 128px 0 0; border-top: 1px solid #dce9f3; }
    .school-logo { position: absolute; top: 14px; right: 8px; width: 96px; height: 96px; object-fit: contain; filter: drop-shadow(0 5px 9px rgba(15, 67, 100, .12)); }
    .education-entry:first-child .school-logo { top: 0; }
    .education-entry:first-child { padding-top: 0; border-top: 0; }
    .education-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; color: var(--blue-deep); font-size: 12px; font-weight: 800; letter-spacing: .04em; }
    .education-entry h3 { margin: 5px 0 2px; color: var(--ink); font-size: 18px; letter-spacing: -.02em; }
    .education-degree { margin: 0 0 9px; color: #2478b7; font-size: 13px; font-weight: 750; }
    .education-facts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .education-fact { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; color: #455365; font-size: 12px; line-height: 1.6; }
    .education-fact b { color: #1e6ba5; font-weight: 800; }
    .experience-list { position: relative; display: grid; gap: 0; margin: 4px 0 0; padding: 0 0 0 20px; }
    .experience-list::before { content: ""; position: absolute; left: 3px; top: 7px; bottom: 28px; width: 1px; background: linear-gradient(var(--blue), rgba(22,141,233,.12)); }
    .experience-entry { position: relative; padding: 0 0 29px 20px; }
    .experience-entry::before { content: ""; position: absolute; left: -23px; top: 7px; width: 10px; height: 10px; border: 3px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2px rgba(22,141,233,.26); }
    .experience-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: var(--blue-deep); font-size: 12px; font-weight: 800; letter-spacing: .045em; }
    .experience-tag { flex: 0 0 auto; padding: 3px 7px; border: 1px solid rgba(22,141,233,.32); border-radius: 999px; color: #246493; background: #f1f8fe; font-size: 10px; letter-spacing: .02em; }
    .experience-entry h3 { margin: 0; color: var(--ink); font-size: 19px; letter-spacing: -.025em; line-height: 1.35; }
    .experience-role { margin: 4px 0 9px; color: #1f77b5; font-size: 14px; font-weight: 750; }
    .experience-summary { margin: 0 0 10px; color: #475365; font-size: 13px; line-height: 1.7; }
    .experience-bullets { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .experience-bullets li { position: relative; padding-left: 13px; color: #3d4858; font-size: 13px; line-height: 1.65; }
    .experience-bullets li::before { content: ""; position: absolute; top: .68em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-top: 14px; }
    .metric { min-width: 0; padding: 9px 8px; border-top: 2px solid var(--blue); background: #f4f9fd; }
    .metric strong { display: block; overflow: hidden; color: var(--ink); font-size: 14px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .metric span { display: block; margin-top: 4px; color: #5d6b7b; font-size: 10px; line-height: 1.3; }
    .growth-section { margin: -5px 0 26px 20px; padding: 16px; border: 1px solid #deebf5; border-radius: 12px; background: linear-gradient(135deg, #f9fcff, #f2f8fd); }
    .growth-section h4 { margin: 0 0 10px; color: var(--ink); font-size: 14px; }
    .growth-table { display: grid; border-top: 1px solid #dce8f1; }
    .growth-row { display: grid; grid-template-columns: 82px 1.45fr 1.1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #e2edf5; color: #465366; font-size: 12px; line-height: 1.45; }
    .growth-row:last-child { border-bottom: 0; }
    .growth-row b { color: var(--blue-deep); }

    /* 竞赛作品：三项目导航与产品化案例展示 */
    .competition-shell { display: grid; gap: 17px; }
    .competition-nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 7px; border: 1px solid #dce8f2; background: #f3f8fc; }
    .competition-tab { appearance: none; border: 1px solid transparent; padding: 9px 13px; color: #38516a; background: transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 800; transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease; }
    .competition-tab:hover { color: var(--blue-deep); background: rgba(255,255,255,.72); }
    .competition-tab:focus-visible { outline: 3px solid rgba(22,141,233,.28); outline-offset: 2px; }
    .competition-tab.is-active { border-color: var(--ink); color: #fff; background: var(--ink); box-shadow: 0 6px 14px rgba(7,15,27,.16); }
    .project-panel { display: grid; gap: 18px; animation: project-panel-in 260ms var(--ease) both; }
    @keyframes project-panel-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .project-hero { display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(235px, .78fr); gap: 18px; align-items: stretch; }
    .project-media { min-height: 226px; overflow: hidden; border: 1px solid #bed7e8; background: #07131f; box-shadow: 0 14px 26px rgba(18, 85, 128, .12); }
    .project-video { display: block; width: 100%; height: 100%; min-height: 226px; object-fit: cover; background: #07131f; }
    .project-image { display: block; width: 100%; height: 100%; min-height: 226px; object-fit: cover; object-position: center; background: #eaf3fa; }
    .project-image.is-poster { object-fit: contain; }
    .project-visual { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: end; min-height: 226px; padding: 22px; overflow: hidden; background: linear-gradient(135deg, #061727, #0c5183); }
    .project-visual::before { content: ""; position: absolute; inset: 0; opacity: .25; background-image: linear-gradient(rgba(255,255,255,.45) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.45) 1px, transparent 1px); background-size: 30px 30px; transform: skewY(-8deg) scale(1.18); }
    .project-visual strong { position: absolute; top: 19px; left: 21px; z-index: 1; max-width: 75%; color: #fff; font-size: clamp(21px, 3vw, 30px); line-height: 1.08; letter-spacing: -.04em; }
    .project-visual span { position: relative; z-index: 1; padding: 8px; border: 1px solid rgba(255,255,255,.48); color: #fff; background: rgba(3,20,33,.45); font-size: 11px; font-weight: 750; line-height: 1.35; }
    .project-brief { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; padding: 4px 0; }
.project-eyebrow { margin: 0 0 7px; color: var(--blue-deep); font-size: 13px; font-weight: 850; letter-spacing: .1em; }
.project-brief h3 { margin: 0; color: var(--ink); font-size: clamp(24px, 3.2vw, 34px); letter-spacing: -.045em; line-height: 1.08; }
.project-type { margin: 8px 0 12px; color: #2478b7; font-size: 15px; font-weight: 800; }
.project-summary { margin: 0; color: #445366; font-size: 15px; line-height: 1.8; }
.project-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.project-actions a { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border: 1px solid #b9d6eb; border-radius: 999px; color: #086fb8; background: #f4faff; font-size: 13px; font-weight: 800; line-height: 1; text-decoration: none; transition: color 180ms ease, background 180ms ease, border-color 180ms ease; }
.project-actions a:hover { border-color: #087ac7; color: #fff; background: #087ac7; }
    .project-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 0; padding: 0; list-style: none; }
    .project-fact { min-width: 0; padding: 10px; border-top: 2px solid var(--blue); background: #f2f8fc; }
    .project-fact b, .project-fact span { display: block; }
.project-fact b { color: #1d415f; font-size: 12px; letter-spacing: .05em; }
.project-fact span { margin-top: 4px; color: #263647; font-size: 14px; font-weight: 750; line-height: 1.55; }
.project-section { padding: 16px; border: 1px solid #dce9f3; background: linear-gradient(135deg, #fbfdff, #f3f9fd); }
.project-section h4 { margin: 0 0 10px; color: var(--ink); font-size: 19px; }
.project-section > p { margin: 0; color: #485769; font-size: 15px; line-height: 1.8; }
.project-points { display: grid; gap: 7px; margin: 11px 0 0; padding: 0; list-style: none; }
.project-points li { position: relative; padding-left: 15px; color: #465466; font-size: 14px; line-height: 1.75; }
    .project-points li::before { content: ""; position: absolute; top: .68em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
.project-flow { display: flex; align-items: stretch; gap: 12px; }
.project-flow-step { flex: 1 1 0; min-width: 0; min-height: 132px; padding: 17px; border: 1px solid #d8e7f1; border-radius: 16px; background: #fff; box-shadow: 0 8px 18px rgba(27, 91, 132, .06); }
.project-flow-arrow { display: grid; flex: 0 0 30px; place-items: center; align-self: center; color: var(--blue); font-size: 22px; font-weight: 900; line-height: 1; }
.project-flow-index { color: var(--blue-deep); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
.project-flow-step b { display: block; margin-top: 7px; color: var(--ink); font-size: 15px; line-height: 1.45; }
.project-flow-step span { display: block; margin-top: 7px; color: #5b6a7a; font-size: 13px; line-height: 1.6; }
.project-note { margin: -4px 0 0; color: #66778a; font-size: 13px; line-height: 1.75; }
    @media (max-width: 700px) {
      .skip { top: 14px; right: 14px; padding: 8px 13px; font-size: 12px; }
      .stage { width: 100vw; height: 56.25vw; }
      .card-ui::after { display: none; }
      .modal-backdrop { padding: 14px; }
      .modal-header { padding: 21px 20px 13px; }
      .modal-content { padding: 18px 20px 24px; font-size: 14px; }
      .modal { width: 100%; }
      .education-entry { min-height: 70px; padding-right: 76px; }
      .school-logo { top: 14px; right: 0; width: 60px; height: 60px; }
      .competition-nav { flex-wrap: nowrap; overflow-x: auto; }
      .competition-tab { flex: 0 0 auto; }
      .project-hero { grid-template-columns: 1fr; gap: 14px; }
      .project-media, .project-video, .project-visual { min-height: 180px; }
      .project-facts { grid-template-columns: 1fr; }
  .project-flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .project-flow-step { min-height: 116px; padding: 14px; border-radius: 12px; }
      .project-flow-arrow { display: none; }
      .experience-list { padding-left: 16px; }
      .experience-entry { padding-left: 17px; }
      .experience-entry::before { left: -19px; }
      .experience-meta { align-items: flex-start; flex-direction: column; gap: 4px; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .growth-section { margin-left: 16px; padding: 13px; }
      .growth-row { grid-template-columns: 58px 1fr; gap: 6px 10px; }
      .growth-row span:last-child { grid-column: 2; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }

/* PROJECT_DRAWINGS_STYLE_START */
    .competition-nav { position: relative; z-index: 5; display: grid; grid-template-columns: repeat(var(--project-count, 4), minmax(0, 1fr)); gap: 12px; width: 100%; padding: 12px 0; border: 0; background: #fcfcfb; }
.competition-tab { width: 100%; min-width: 0; min-height: 48px; padding: 12px 16px; border: 1px solid #cddfed; border-radius: 999px; background: #f0f7fc; font-size: 14px; letter-spacing: .035em; }
.competition-tab.is-active { background: var(--ink); border-color: var(--ink); box-shadow: 0 5px 14px rgba(14,17,25,.12); }
.competition-tab:focus-visible { outline: 3px solid #168de9; outline-offset: 2px; }
.project-hero { align-items: start; }
.project-media { min-width: 0; min-height: 0; align-self: start; border-radius: 12px; }
.project-video { width: 100%; height: auto; min-height: 0; aspect-ratio: 16 / 9; object-fit: contain; }
.project-image { width: 100%; height: auto; min-height: 0; aspect-ratio: 16 / 9; object-fit: cover; }
.project-image.is-poster { object-fit: contain; }
.project-video:fullscreen { width: 100vw; height: 100vh; object-fit: contain; }
.project-media-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 13px; color: #d4e7f5; background: #0c1e2c; font-size: 11px; line-height: 1.5; }
.project-media-bar button { flex: none; padding: 6px 12px; border: 1px solid #657d90; border-radius: 999px; color: #fff; background: transparent; font-size: 11px; cursor: pointer; }
.project-media.is-expanded { grid-column: 1 / -1; width: 100%; }
.project-hero:has(.is-expanded) .project-brief { grid-column: 1 / -1; }
.project-drawings { margin-top: 16px; padding-top: 28px; border-top: 1px solid #d8e5ef; }
.drawings-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.drawings-heading h4 { margin: 2px 0 0; font-size: 23px; letter-spacing: -.03em; color: var(--ink); }
.drawings-heading p { max-width: 480px; margin: 0; font-size: 14px; line-height: 1.65; color: #5c6d7d; }
.drawings-kicker { color: var(--blue-deep); font-size: 11px; font-weight: 800; letter-spacing: .13em; }
.drawings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 18px; }
.drawing-card { min-width: 0; margin: 0; }
.drawing-card.is-wide { grid-column: 1 / -1; }
.drawing-open { position: relative; display: block; width: 100%; padding: 14px; overflow: hidden; border: 1px solid #dfE7ed; border-radius: 12px; background: #fff; cursor: zoom-in; transition: border-color 180ms ease, box-shadow 180ms ease; }
.drawing-open:hover { border-color: var(--blue); box-shadow: 0 6px 18px rgba(22,141,233,.1); }
.drawing-open:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.drawing-open img { display: block; width: 100%; height: 260px; aspect-ratio: 16 / 10; object-fit: contain; }
.drawing-card.is-wide img { height: 300px; aspect-ratio: 2 / 1; }
.drawing-open::after { content: '↗'; position: absolute; right: 11px; bottom: 11px; display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid #dbe8f1; border-radius: 50%; color: #0876ca; background: rgba(248,252,255,.95); font-size: 16px; }
.drawing-caption { padding: 11px 2px 0; }
.drawing-caption strong { display: block; color: #172838; font-size: 15px; font-weight: 800; }
.drawing-caption span { display: block; margin-top: 3px; font-size: 13px; line-height: 1.55; color: #67798a; }
.drawing-boards { margin-top: 25px; padding-top: 18px; border-top: 1px solid #deE8ef; }
.drawing-boards summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; list-style: none; color: #172c3e; cursor: pointer; font-size: 14px; font-weight: 800; }
.drawing-boards summary::-webkit-details-marker { display: none; }

      let activeKey = 'base';

      // 开场阶段只请求视频。简历底图在视频结束/跳过后加载，悬停图在底图就绪后再预取。
      const visualLoads = new Map();
      function loadVisual(key) {
        const image = visuals[key];
        if (!image) return Promise.resolve();
        if (visualLoads.has(key)) return visualLoads.get(key);
        const source = image.dataset.src;
        if (source && !image.getAttribute('src')) image.src = source;
        // Hidden images can leave decode() pending in some browsers; the load event is enough
        // to reveal the base visual while the browser finishes its normal paint decode.
        const load = new Promise(resolve => {
          if (image.complete) { resolve(); return; }
          const finish = () => resolve();
          image.addEventListener('load', finish, { once: true });
          image.addEventListener('error', finish, { once: true });
        });
        visualLoads.set(key, load);
        return load;
      }

      function preloadHoverVisuals() {
        ['01', '02', '03', '04'].forEach(key => {
          window.setTimeout(() => { loadVisual(key); }, 0);
        });
      }

      function activate(key) {
        if (!visuals[key] || key === activeKey) return;
        if (key !== 'base' && (!visuals[key].getAttribute('src') || !visuals[key].complete)) {
          loadVisual(key).then(() => activate(key));
          return;
        }
        const previous = activeKey === 'base' ? null : visuals[activeKey];
        if (previous) previous.classList.remove('is-visible', 'is-entering');
        if (key !== 'base') {
          const incoming = visuals[key];
          incoming.classList.add('is-entering');
          // Paint the incoming static pose before its opacity-only crossfade.
          void incoming.offsetWidth;
          incoming.classList.add('is-visible');
          requestAnimationFrame(() => incoming.classList.remove('is-entering'));
        }
        activeKey = key;
        cards.forEach(card => card.classList.toggle('is-selected', card.dataset.key === key));
      }

      function clearEffect() { activate('base'); }

        if (app.classList.contains('resume-visible')) return;
        video.pause();
        // 保留视频最后一帧，直到底图成功解码，避免在弱网下出现白屏或黑屏。
        loadVisual('base').then(() => {

          intro.classList.add('is-leaving');

        const buttons = new Map();

        const renderPanel = project => {
          panelHost.querySelectorAll('video').forEach(video => video.pause());
          panelHost.replaceChildren();
          const panel = document.createElement('article'); panel.className = 'project-panel'; panel.setAttribute('role', 'tabpanel'); panel.id = `project-panel-${project.id}`;
          const hero = document.createElement('section'); hero.className = 'project-hero';
          const media = document.createElement('div'); media.className = 'project-media';
          if (project.video) {
            const video = document.createElement('video'); video.className = 'project-video'; video.controls = true; video.playsInline = true; video.preload = 'metadata'; video.src = project.video; video.poster = projectMediaInfo[project.id]?.poster || ''; video.setAttribute('aria-label', project.videoLabel); video.append(document.createTextNode('你的浏览器暂不支持此视频播放。'));
            media.append(video);
            const mediaBar = document.createElement('div'); mediaBar.className = 'project-media-bar';
            const mediaStatus = document.createElement('span'); mediaStatus.textContent = projectMediaInfo[project.id]?.quality || 'PROJECT DEMO';
            const expandButton = document.createElement('button'); expandButton.type = 'button'; expandButton.textContent = '展开演示'; expandButton.setAttribute('aria-pressed', 'false');
            expandButton.addEventListener('click', () => { const expanded = media.classList.toggle('is-expanded'); expandButton.textContent = expanded ? '收起演示' : '展开演示'; expandButton.setAttribute('aria-pressed', String(expanded)); });
            mediaBar.append(mediaStatus, expandButton); media.append(mediaBar);

          } else if (project.image) {
            const image = document.createElement('img'); image.className = 'project-image'; if (project.imageFit === 'contain') image.classList.add('is-poster'); image.src = project.image; image.alt = project.imageAlt || project.title; image.loading = 'eager'; image.decoding = 'async'; media.append(image);
          } else {
            const visual = document.createElement('div'); visual.className = 'project-visual';
            const visualTitle = document.createElement('strong'); visualTitle.textContent = project.visualTitle; visual.append(visualTitle);
            project.visualItems.forEach(label => { const visualItem = document.createElement('span'); visualItem.textContent = label; visual.append(visualItem); });
            media.append(visual);
          }
          const brief = document.createElement('div'); brief.className = 'project-brief';
          const eyebrow = document.createElement('p'); eyebrow.className = 'project-eyebrow'; eyebrow.textContent = project.number;
          const title = document.createElement('h3'); title.textContent = project.title;
          const type = document.createElement('p'); type.className = 'project-type'; type.textContent = project.type;
          const summary = document.createElement('p'); summary.className = 'project-summary'; summary.textContent = project.summary;
          brief.append(eyebrow, title, type, summary);
          if (project.links?.length) {
            const actions = document.createElement('div'); actions.className = 'project-actions';
            project.links.forEach(([label, href]) => { const link = document.createElement('a'); link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = label; actions.append(link); });
            brief.append(actions);
          }
          hero.append(media, brief); panel.append(hero);

          const facts = document.createElement('ul'); facts.className = 'project-facts';
          project.facts.forEach(([label, value]) => { const fact = document.createElement('li'); fact.className = 'project-fact'; const factLabel = document.createElement('b'); factLabel.textContent = label; const factValue = document.createElement('span'); factValue.textContent = value; fact.append(factLabel, factValue); facts.append(fact); });
          panel.append(facts);

          project.sections.forEach(sectionData => { const section = document.createElement('section'); section.className = 'project-section'; const heading = document.createElement('h4'); heading.textContent = sectionData.title; const copy = document.createElement('p'); copy.textContent = sectionData.copy; const points = document.createElement('ul'); points.className = 'project-points'; sectionData.points.forEach(point => { const row = document.createElement('li'); row.textContent = point; points.append(row); }); section.append(heading, copy, points); panel.append(section); });

          const flowSection = document.createElement('section'); flowSection.className = 'project-section';
          const flowTitle = document.createElement('h4'); flowTitle.textContent = '项目工作流';
          const flow = document.createElement('div'); flow.className = 'project-flow';
          project.flow.forEach(([titleText, description], index) => { const step = document.createElement('div'); step.className = 'project-flow-step'; const indexText = document.createElement('div'); indexText.className = 'project-flow-index'; indexText.textContent = `STEP ${String(index + 1).padStart(2, '0')}`; const stepTitle = document.createElement('b'); stepTitle.textContent = titleText; const stepDescription = document.createElement('span'); stepDescription.textContent = description; step.append(indexText, stepTitle, stepDescription); flow.append(step); if (index < project.flow.length - 1) { const arrow = document.createElement('span'); arrow.className = 'project-flow-arrow'; arrow.setAttribute('aria-hidden', 'true'); arrow.textContent = '→'; flow.append(arrow); } });
          flowSection.append(flowTitle, flow); panel.append(flowSection);
          const note = document.createElement('p'); note.className = 'project-note'; note.textContent = project.note; panel.append(note);
          appendProjectDrawings(panel, project.id);
          panelHost.append(panel);
        };

        const activateProject = id => {
          const project = projects.find(candidate => candidate.id === id) || projects[0];
          buttons.forEach((button, buttonId) => { const active = buttonId === project.id; button.classList.toggle('is-active', active); button.setAttribute('aria-selected', String(active)); button.tabIndex = active ? 0 : -1; });
          renderPanel(project);
        };

        projects.forEach(project => { const button = document.createElement('button'); button.type = 'button'; button.className = 'competition-tab'; button.id = `project-tab-${project.id}`; button.setAttribute('role', 'tab'); button.setAttribute('aria-controls', `project-panel-${project.id}`); button.textContent = project.nav; button.addEventListener('click', () => activateProject(project.id));
          button.addEventListener('keydown', event => {
            const ids = projects.map(entry => entry.id); const current = ids.indexOf(project.id);
            let next = -1;
            if (event.key === 'ArrowRight') next = (current + 1) % ids.length;
            else if (event.key === 'ArrowLeft') next = (current - 1 + ids.length) % ids.length;
            else if (event.key === 'Home') next = 0;
            else if (event.key === 'End') next = ids.length - 1;
            if (next >= 0) { event.preventDefault(); activateProject(ids[next]); buttons.get(ids[next]).focus(); }
          });
          buttons.set(project.id, button); nav.append(button); });
        shell.append(nav, panelHost); modalContent.append(shell); activateProject(projects[0].id);
      }
      function fillModal(key) {
        const item = details[key];
        modalKicker.textContent = item.kicker;
        modalTitle.textContent = item.title;
        modalContent.replaceChildren();
        const rule = document.createElement('div'); rule.className = 'rule';
        modalContent.append(rule);

        if (item.projects) { renderProjectGallery(item); return; }

        if (item.experiences) {
          const intro = document.createElement('p'); intro.className = 'experience-intro'; intro.textContent = item.intro;
          modalContent.append(intro);
          if (item.education?.length) {
            const education = document.createElement('section'); education.className = 'education-section';
            const heading = document.createElement('h3'); heading.className = 'resume-section-heading'; heading.textContent = '教育背景';
            const educationList = document.createElement('div'); educationList.className = 'education-list';
            item.education.forEach(record => {
              const entry = document.createElement('article'); entry.className = 'education-entry';
              const meta = document.createElement('div'); meta.className = 'education-meta'; meta.textContent = record.period;
              const school = document.createElement('h3'); school.textContent = record.school;
              const degree = document.createElement('p'); degree.className = 'education-degree'; degree.textContent = record.degree;
              const facts = document.createElement('ul'); facts.className = 'education-facts';
              record.facts.forEach(([label, value]) => { const fact = document.createElement('li'); fact.className = 'education-fact'; const term = document.createElement('b'); term.textContent = label; const detail = document.createElement('span'); detail.textContent = value; fact.append(term, detail); facts.append(fact); });
              if (record.logo) { const logo = document.createElement('img'); logo.className = 'school-logo'; logo.src = record.logo; logo.alt = `${record.school}校徽`; logo.decoding = 'async'; logo.draggable = false; entry.append(logo); }
              entry.append(meta, school, degree, facts); educationList.append(entry);
            });
            education.append(heading, educationList); modalContent.append(education);
          }
          const timeline = document.createElement('div'); timeline.className = 'experience-list';
          item.experiences.forEach(experience => {
            const entry = document.createElement('article'); entry.className = 'experience-entry';
            const meta = document.createElement('div'); meta.className = 'experience-meta';
            const period = document.createElement('span'); period.textContent = experience.period;
            const tag = document.createElement('span'); tag.className = 'experience-tag'; tag.textContent = experience.category;
            meta.append(period, tag);
            const company = document.createElement('h3'); company.textContent = experience.company;
            const role = document.createElement('p'); role.className = 'experience-role'; role.textContent = experience.role;
            const summary = document.createElement('p'); summary.className = 'experience-summary'; summary.textContent = experience.summary;
            const bullets = document.createElement('ul'); bullets.className = 'experience-bullets';
            experience.bullets.forEach(text => { const bullet = document.createElement('li'); bullet.textContent = text; bullets.append(bullet); });
            entry.append(meta, company, role, summary, bullets);
            if (experience.metrics?.length) {
              const metrics = document.createElement('div'); metrics.className = 'metric-grid';
              experience.metrics.forEach(([value, label]) => { const metric = document.createElement('div'); metric.className = 'metric'; const strong = document.createElement('strong'); strong.textContent = value; const caption = document.createElement('span'); caption.textContent = label; metric.append(strong, caption); metrics.append(metric); });
              entry.append(metrics);
            }
            timeline.append(entry);
            if (experience.growth?.length) {
              const growth = document.createElement('section'); growth.className = 'growth-section';
              const heading = document.createElement('h4'); heading.textContent = '六个月成长逻辑';
              const table = document.createElement('div'); table.className = 'growth-table';
              experience.growth.forEach(([month, work, metrics]) => { const row = document.createElement('div'); row.className = 'growth-row'; const stage = document.createElement('b'); stage.textContent = month; const workText = document.createElement('span'); workText.textContent = work; const metricText = document.createElement('span'); metricText.textContent = metrics; row.append(stage, workText, metricText); table.append(row); });
              growth.append(heading, table); timeline.append(growth);
            }
          });
          modalContent.append(timeline);
          return;
        }

        const paragraph = document.createElement('p'); paragraph.textContent = item.intro;
        const list = document.createElement('ul'); list.className = 'detail-list';
        item.items.forEach(([label, value]) => {
          const row = document.createElement('li');
          const strong = document.createElement('b'); strong.textContent = label;
          const text = document.createElement('span'); text.textContent = value;
          row.append(strong, text); list.append(row);
        });
        modalContent.append(paragraph, list);
      }

      function openModal(key, trigger) {
        clearTimeout(leaveTimer);
        activate(key);
        lastFocused = trigger;
        fillModal(key);
        modalBackdrop.classList.add('is-open');
        modalBackdrop.setAttribute('aria-hidden', 'false');
        window.setTimeout(() => modalClose.focus(), 40);
      }

      function closeModal() {
        modalContent.querySelectorAll('video').forEach(video => video.pause());
        modalBackdrop.classList.remove('is-open');
        modalBackdrop.setAttribute('aria-hidden', 'true');
        if (lastFocused) lastFocused.focus();
      }

      // 键盘焦点在弹窗内循环，ESC 关闭。
      function trapModalFocus(event) {
        if (document.querySelector('.drawing-viewer[open]')) return;
        if (!modalBackdrop.classList.contains('is-open')) return;
        if (event.key === 'Escape') { closeModal(); return; }
        if (event.key !== 'Tab') return;
        const focusable = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled);
        const first = focusable[0]; const last = focusable[focusable.length - 1];
        if (!focusable.length) { event.preventDefault(); return; }
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }

      video.addEventListener('ended', enterResume, { once: true });
      skipButton.addEventListener('click', enterResume);
      startHint.addEventListener('click', startOnGesture);
      intro.addEventListener('pointerdown', startOnGesture);
      window.addEventListener('load', tryAutoplay, { once: true });
      cardLayer.addEventListener('pointerleave', () => { leaveTimer = window.setTimeout(clearEffect, 90); });
      cardLayer.addEventListener('pointerenter', () => clearTimeout(leaveTimer));
      cards.forEach(card => {
        const key = card.dataset.key;
        card.addEventListener('pointerenter', () => { clearTimeout(leaveTimer); activate(key); });
        card.addEventListener('focus', () => activate(key));
        card.addEventListener('click', () => openModal(key, card));
        card.addEventListener('touchstart', () => activate(key), { passive: true });
        card.addEventListener('touchend', () => { leaveTimer = window.setTimeout(clearEffect, 1100); }, { passive: true });
      });
      modalBackdrop.addEventListener('click', event => { if (event.target === modalBackdrop) closeModal(); });
      modalClose.addEventListener('click', closeModal);
      document.addEventListener('keydown', trapModalFocus);
    })();
  </script>
</body>
</html>
